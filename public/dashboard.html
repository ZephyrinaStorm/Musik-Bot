<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/jpeg" href="/logo.jpg"><title>Musik Control Center</title><link rel="stylesheet" href="/style.css"></head><body><nav><strong class="brand"><img src="/logo.jpg" alt="Musik logo"> Musik</strong><div><a href="/">Home</a><button id="logout">Log out</button></div></nav><main class="dash"><header><span class="tag">CONTROL CENTER</span><h1>Music dashboard</h1><p id="hello">Checking login…</p></header><label for="guild">Your manageable servers</label><select id="guild"><option>Loading servers…</option></select><div class="columns"><section class="panel"><small>NOW PLAYING</small><div class="disc"><img src="/logo.jpg" alt="Musik music logo"></div><h2 id="now">Nothing playing</h2><p id="status">Select a server.</p><div class="controls"><button id="join">Join voice</button><button data-action="pause">Pause</button><button data-action="resume">Resume</button><button data-action="skip">Skip</button><button data-action="shuffle">Shuffle</button><button data-action="stop">Stop</button><button data-action="disconnect">Leave</button></div><form id="play"><input id="query" placeholder="Song name or URL" maxlength="500" required><button class="primary">Play / Queue</button></form><div class="settings"><label>Volume <strong id="volvalue">100</strong><input id="volume" type="range" min="0" max="200" value="100"></label><label>Loop <select id="loop"><option value="off">Off</option><option value="track">Track</option><option value="queue">Queue</option></select></label></div></section><section class="panel"><h2>Up next</h2><ol id="queue"></ol><h3>Recently played</h3><ol id="history"></ol></section></div><p id="message" role="status"></p></main><script src="/dashboard.js"></script></body></html>
